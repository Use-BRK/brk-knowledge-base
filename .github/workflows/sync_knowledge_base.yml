name: Sync Knowledge Base → n8n PGVector

on:
  push:
    branches:
      - main
    paths:
      - 'ecommerce/**'
      - 'triagem/**'
      - 'ativo/**'
      - 'receptivo/**'
      - 'sac/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify changed files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '\.md$' | grep -v 'README.md' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed markdown files: $CHANGED"

      - name: Sync each changed file to n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          echo "${{ steps.changed.outputs.files }}" | while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            echo "Syncing: $file"
            python3 scripts/sync_chunk.py "$file"
          done
